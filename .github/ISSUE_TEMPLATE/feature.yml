name: Feature request
description: Something Dawnmere should do that it does not do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, in your own words. What happens today, and why it gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Rough is fine.
  - type: input
    id: apps
    attributes:
      label: Which apps does this involve?
      placeholder: Claude Code, Codex, Cursor, ...
