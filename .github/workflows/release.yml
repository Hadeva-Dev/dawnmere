# A tag vX.Y.Z builds the CLI wheel and the engine wheel (the engine at the tag in ENGINE_TAG), writes their sha256 into
# install.sh, and publishes all of it as one release: the install line downloads only from here.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # the connector's tests below need Node 22 or later
      - name: Engine source (checked out at ENGINE_TAG below)
        uses: actions/checkout@v4
        with:
          repository: Hadeva-Dev/lflabs-memory-engine
          path: engine
          fetch-depth: 0
          token: ${{ secrets.ENGINE_REPO_TOKEN }}  # the engine repo is private until launch
      - name: Wheels
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$VERSION\"$" cli/pyproject.toml || { echo "cli/pyproject.toml is not at $VERSION"; exit 1; }
          (cd engine && git checkout "$(cat ../ENGINE_TAG)")
          uv build --wheel --out-dir dist cli
          uv build --wheel --out-dir dist engine
          CLI=$(ls dist/lflabs_memory_cli-*.whl) ENGINE=$(ls dist/lflabs_memory_engine-*.whl)
          uv run --no-project python cli/tools/render_install.py "$VERSION" "$CLI" "$ENGINE" dist/install.sh
          (cd dist && shasum -a 256 *.whl install.sh > SHA256SUMS)
      - name: Tests before publishing
        run: |
          ln -s "$PWD/engine" ../lflabs-memory-engine
          (cd cli && uv run pytest -q)
          (cd connector && npm ci && npm test)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  # A clean runner installs from the release just published, with a fake claude, and setup must finish in none mode.
  install:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Fake claude on PATH (records every call)
        run: |
          mkdir -p "$HOME/fakebin"
          printf '#!/bin/sh\necho "$@" >> "$HOME/claude-calls.log"\ncase "$1" in --version) echo "2.1.301 (Claude Code)";; esac\n' > "$HOME/fakebin/claude"
          chmod +x "$HOME/fakebin/claude"
          echo "$HOME/fakebin" >> "$GITHUB_PATH"
      - name: Install line
        run: curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | LFLABS_MEMORY_NO_SETUP=1 sh
      - name: Setup and doctor
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dawnmere setup --yes --plain --backend none
          dawnmere doctor
